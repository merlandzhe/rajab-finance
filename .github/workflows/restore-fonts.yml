name: Materialize HESAP fonts
on:
  push:
    branches: [sync-production-2026-11-16]
    paths:
      - .github/workflows/restore-fonts.yml
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Extract verified binary fonts into Git
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf rajab-source.tar.gz public/fonts/DejaVuSans-Bold.ttf public/fonts/DejaVuSans.ttf
          echo '0298a9683ea927e703857d9f0359763ba84db137  public/fonts/DejaVuSans-Bold.ttf' | sha1sum --check --status
          echo '3061cf7af25793a655a1ff5a509385f3620f3eb3  public/fonts/DejaVuSans.ttf' | sha1sum --check --status
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));delete p.scripts.prebuild;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          rm -f rajab-source.tar.gz .github/workflows/restore-fonts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'sync: materialize production font assets'
          git push origin HEAD:refs/heads/sync-production-2026-11-16
